
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <meta name="description" content="Scheda digitale ufficiale di Notaro Officine Technology con contatti rapidi.">

  <title>Notaro Officine Technology</title>

  <style>
    :root {
      color-scheme: dark;
      --red: #c9473d;
      --white: #f4f4f2;
      --muted: #b5b8bb;
      --lab: #e64aa6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      font-family: Inter, ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background: #101214;

      background-image:
        linear-gradient(
          180deg,
          rgba(9,11,13,.62),
          rgba(9,11,13,.84) 52%,
          rgba(9,11,13,.94)
        ),
        linear-gradient(
          90deg,
          rgba(8,10,12,.4),
          rgba(8,10,12,.16)
        ),
        url("https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=1800&q=85");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      width: min(100%, 440px);
      text-align: center;
      padding: 28px 24px 24px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 26px;
      background: rgba(15,17,19,.58);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 80px rgba(0,0,0,.36);
    }

    .mark {
      width: 54px;
      height: 4px;
      margin: 0 auto 22px;
      border-radius: 10px;
      background: var(--red);
      box-shadow: 0 0 20px rgba(201,71,61,.4);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 10px;
      letter-spacing: .28em;
      font-weight: 700;
      color: #d4d5d6;
      text-transform: uppercase;
    }

    /* LOGO NOTARO */
    .notaro-logo {
      display: block;
      width: min(100%, 300px);
      height: auto;
      max-height: 160px;
      object-fit: contain;
      object-position: center;
      margin: 18px auto 22px;
      background: transparent;
    }

    .intro {
      margin: 19px auto 28px;
      max-width: 290px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    .button {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 18px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      color: var(--white);
      text-decoration: none;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      background: rgba(27,30,33,.92);
      transition: transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(201,71,61,.9);
      background: rgba(38,31,31,.96);
      outline: none;
    }

    .button.primary {
      border-color: rgba(201,71,61,.75);
      background: linear-gradient(
        135deg,
        rgba(135,42,37,.94),
        rgba(61,28,28,.96)
      );
    }

    .icon {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
    }

    .footer {
      margin: 25px 0 0;
      color: #9da1a4;
      font-size: 10px;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    /* SEZIONE CARMINELLOLAB */
    .powered {
      margin-top: 23px;
      padding-top: 17px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .powered-label {
      margin: 0 0 12px;
      color: #92969a;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .lab-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: opacity .18s ease;
    }

    .lab-link:hover,
    .lab-link:focus-visible {
      opacity: .8;
      outline: none;
    }

    /* Logo originale CarminelloLab */
    .lab-logo {
      display: block;
      width: min(100%, 180px);
      max-width: 180px;
      max-height: 75px;
      height: auto;
      object-fit: contain;
      object-position: center;
      background: transparent;
      filter: drop-shadow(0 0 8px rgba(230,74,166,.16));
    }

    @media (max-width: 380px) {
      body {
        padding: 18px 12px;
        background-attachment: scroll;
      }

      .card {
        padding: 24px 18px 20px;
        border-radius: 22px;
      }

      .notaro-logo {
        width: min(100%, 260px);
        max-height: 135px;
      }

      .button {
        padding: 14px 12px;
        font-size: 11px;
      }

      .lab-logo {
        max-width: 155px;
        max-height: 65px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button,
      .lab-link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="mark" aria-hidden="true"></div>

    <p class="eyebrow">
      Precisione · Tecnologia · Competenza
    </p>

    <!-- LOGO NOTARO -->
    <img
      class="notaro-logo"
      src="notaro-logo.png"
      alt="Notaro Officine Technology"
    >

    <p class="intro">
      Tecnica, esperienza e attenzione al dettaglio.
      Tutti i contatti dell’officina, a portata di mano.
    </p>

    <nav class="actions" aria-label="Contatti officina">

      <!-- INSTAGRAM NOTARO -->
      <a
        class="button primary"
        href="https://www.instagram.com/notaro_officine/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="3" y="3" width="18" height="18" rx="5"
            stroke="currentColor" stroke-width="1.8"
          />
          <circle
            cx="12" cy="12" r="4"
            stroke="currentColor" stroke-width="1.8"
          />
          <circle
            cx="17.6" cy="6.6" r="1.1"
            fill="currentColor"
          />
        </svg>
        SEGUICI SU INSTAGRAM
      </a>

      <!-- TELEFONO -->
      <a
        class="button"
        href="tel:+393476308783"
      >
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M7.1 3.8 9.6 7.5 8.1 9.6c1.1 2.2 2.9 4 5.1 5.1l2.1-1.5 3.7 2.5-.6 3.4c-.2.9-1 1.5-1.9 1.5C9.2 20.6 3.4 14.8 3.4 7.5c0-.9.6-1.7 1.5-1.9l2.2-.5Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        CONTATTA L’OFFICINA
      </a>

    </nav>

    <p class="footer">
      Notaro Officine Technology
    </p>

    <!-- FIRMA CARMINELLOLAB -->
    <div class="powered">

      <p class="powered-label">
        POWERED BY
      </p>

      <a
        class="lab-link"
        href="https://www.instagram.com/carminellolab_2.0/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="CarminelloLab su Instagram"
      >
        <img
          class="lab-logo"
          src="carminello_lab_logo.png"
          alt="CarminelloLab"
          loading="lazy"
        >
      </a>

    </div>

  </main>
</body>
</html>
